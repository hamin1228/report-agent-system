[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "report-agent-system"
version = "0.1.0"
description = "Production-oriented multi-agent report generation system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Hamin" }]
dependencies = [
  "httpx>=0.27,<1",
  "litellm>=1.60,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
report-agent = "report_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/report_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["report_agent"]

[[tool.mypy.overrides]]
module = ["rich", "rich.*"]
ignore_missing_imports = true
